<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary. Per-route title, description and canonical are updated at runtime by useSeo(). -->
    <title>Ponsia Perps | Perps for every PONS token on Robinhood Chain</title>
    <meta
      name="description"
      content="Ponsia Perps lists a perpetual market for every token launched on PONS. Long the runners, short the rugs, with live prices and ETH margin on Robinhood Chain."
    />
    <link id="canonical" rel="canonical" href="https://ponsia.xyz/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="Ponsia Perps" />
    <meta name="theme-color" content="#072723" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ponsia Perps" />
    <meta id="og-url" property="og:url" content="https://ponsia.xyz/" />
    <meta id="og-title" property="og:title" content="Ponsia Perps | Perps for every PONS token" />
    <meta
      id="og-description"
      property="og:description"
      content="Long the runners. Short the rugs. A perp market for every PONS token, built on Robinhood Chain."
    />
    <meta property="og:image" content="https://ponsia.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ponsia Perps: perps for every PONS token. Long the runners. Short the rugs. Built on Robinhood Chain." />
    <meta property="og:locale" content="en_US" />

    <!-- X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PonsiaPerps" />
    <meta id="tw-title" name="twitter:title" content="Ponsia Perps | Perps for every PONS token" />
    <meta name="twitter:description" content="Long the runners. Short the rugs. Built on Robinhood Chain." />
    <meta name="twitter:image" content="https://ponsia.xyz/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ponsia.xyz/#org",
            "name": "Ponsia Perps",
            "url": "https://ponsia.xyz/",
            "logo": "https://ponsia.xyz/brand/logo-500.png",
            "sameAs": ["https://x.com/PonsiaPerps"]
          },
          {
            "@type": "WebSite",
            "@id": "https://ponsia.xyz/#website",
            "name": "Ponsia Perps",
            "url": "https://ponsia.xyz/",
            "publisher": { "@id": "https://ponsia.xyz/#org" }
          },
          {
            "@type": "WebApplication",
            "name": "Ponsia Perps",
            "url": "https://ponsia.xyz/app/markets",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "description": "Perpetual markets for every PONS token on Robinhood Chain: live prices, long and short order tickets, and launch listings.",
            "publisher": { "@id": "https://ponsia.xyz/#org" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>Ponsia Perps needs JavaScript to show live markets. Perps for every PONS token on Robinhood Chain.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
