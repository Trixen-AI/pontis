<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary. Per-route title, description and canonical are updated at runtime by useSeo(). -->
    <title>FunPerps | Perps for every Pump.fun token on Solana</title>
    <meta
      name="description"
      content="FunPerps opens a perpetual market for every token launched on Pump.fun. Long the runners, short the rugs, with live prices and SOL margin on Solana."
    />
    <link id="canonical" rel="canonical" href="https://funperps.xyz/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="FunPerps" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FunPerps" />
    <meta id="og-url" property="og:url" content="https://funperps.xyz/" />
    <meta id="og-title" property="og:title" content="FunPerps | Perps for every Pump.fun token" />
    <meta
      id="og-description"
      property="og:description"
      content="Long the runners. Short the rugs. A perp market for every Pump.fun token, built on Solana."
    />
    <meta property="og:image" content="https://funperps.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FunPerps: perps for every Pump.fun token. Long the runners. Short the rugs. Built on Solana." />
    <meta property="og:locale" content="en_US" />

    <!-- X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FunPerps_xyz" />
    <meta id="tw-title" name="twitter:title" content="FunPerps | Perps for every Pump.fun token" />
    <meta name="twitter:description" content="Long the runners. Short the rugs. Built on Solana." />
    <meta name="twitter:image" content="https://funperps.xyz/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://funperps.xyz/#org",
            "name": "FunPerps",
            "url": "https://funperps.xyz/",
            "logo": "https://funperps.xyz/brand/logo-500.png",
            "sameAs": ["https://x.com/FunPerps_xyz"]
          },
          {
            "@type": "WebSite",
            "@id": "https://funperps.xyz/#website",
            "name": "FunPerps",
            "url": "https://funperps.xyz/",
            "publisher": { "@id": "https://funperps.xyz/#org" }
          },
          {
            "@type": "WebApplication",
            "name": "FunPerps",
            "url": "https://funperps.xyz/app/markets",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "description": "Perpetual markets for every Pump.fun token on Solana: live prices, long and short order tickets, and launch listings.",
            "publisher": { "@id": "https://funperps.xyz/#org" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>FunPerps needs JavaScript to show live markets. Perps for every Pump.fun token on Solana.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
